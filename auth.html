<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FeraPhone — вход</title><link rel="stylesheet" href="css/style.css"></head><body class="auth-page"><div class="auth-layout"><a class="logo auth-logo" href="index.html">Fera<span>Phone</span></a><div class="auth-card"><div class="tabs"><button class="tab active" data-mode="login">Вход</button><button class="tab" data-mode="register">Регистрация</button></div><h1 id="authTitle">С возвращением 👋</h1><p id="authSubtitle" class="muted">Войди, чтобы сохранять телефоны в избранное.</p><form id="authForm"><label>Имя <input id="name" type="text" autocomplete="name" placeholder="Ферхада"></label><label>Email <input id="email" type="email" required autocomplete="email" placeholder="you@example.com"></label><label>Пароль <input id="password" type="password" required minlength="6" autocomplete="current-password" placeholder="Минимум 6 символов"></label><button class="btn btn-primary full" type="submit" id="submitBtn">Войти</button></form><button id="resetBtn" class="text-btn">Забыли пароль?</button><p id="authMessage" class="form-message"></p></div></div>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script><script src="js/firebase.js"></script><script src="js/auth.js"></script></body></html>
