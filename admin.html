<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FeraPhone — админ-панель</title><link rel="stylesheet" href="css/style.css"></head><body>
<header class="header"><div class="container nav"><a class="logo" href="index.html">Fera<span>Phone</span></a><nav class="nav-links"><a href="index.html">Сайт</a><a class="active" href="admin.html">Админ-панель</a></nav><div class="nav-actions"><span id="userName" class="user-name"></span><button id="logoutBtn" class="btn btn-dark">Выйти</button></div></div></header>
<main class="section"><div class="container"><div id="adminDenied" class="empty hidden"><div>🔒</div><h2>Доступ запрещён</h2><p>Эта страница доступна только пользователю с ролью admin.</p><a class="btn btn-primary" href="index.html">На главную</a></div><div id="adminContent" class="hidden"><div class="section-head"><div><p class="eyebrow">Управление</p><h1>Магазин телефонов</h1></div></div><div class="admin-stats"><div class="stat-card"><span>Телефонов</span><b id="recipeTotal">0</b></div><div class="stat-card"><span>Пользователей</span><b id="userTotal">0</b></div><div class="stat-card"><span>Оценок</span><b id="reviewTotal">0</b></div></div>
<section class="panel"><div class="panel-head"><h2 id="formTitle">Добавить телефон</h2><button id="cancelEdit" class="btn btn-outline hidden">Отмена</button></div><form id="recipeForm" class="admin-form"><input type="hidden" id="recipeId"><label>Название модели<input id="recipeTitle" required maxlength="100" placeholder="iPhone 17 Pro"></label><label>Бренд<select id="recipeCategory" required><option>Apple</option><option>Samsung</option><option>Xiaomi</option><option>Google</option><option>OnePlus</option></select></label><label>Описание<textarea id="recipeDescription" required maxlength="300"></textarea></label><label>Изображение URL<input id="recipeImage" type="url" placeholder="https://..."></label><div class="two-cols"><label>Цена, ₸<input id="recipeTime" type="number" min="1" required></label><label>Память<select id="recipeDifficulty"><option>128 ГБ</option><option>256 ГБ</option><option>512 ГБ</option><option>1 ТБ</option></select></label></div><label>Характеристики<textarea id="recipeIngredients" required placeholder="6.3 дюйма&#10;48 Мп камера&#10;5G"></textarea></label><label>Комплектация<textarea id="recipeSteps" required placeholder="Смартфон&#10;Кабель USB-C&#10;Документация"></textarea></label><button class="btn btn-primary" type="submit">Сохранить телефон</button><p id="adminMsg" class="form-message"></p></form></section>
<section class="panel"><div class="panel-head"><h2>Каталог</h2><span class="muted">Real-time onSnapshot</span></div><div id="adminRecipes" class="admin-list"></div></section><section class="panel"><div class="panel-head"><h2>Пользователи</h2></div><div id="usersList" class="admin-list"></div></section></div></div></main><footer class="footer"><div class="container">FeraPhone Admin</div></footer>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script><script src="js/firebase.js"></script><script src="js/common.js"></script><script src="js/admin.js"></script></body></html>
